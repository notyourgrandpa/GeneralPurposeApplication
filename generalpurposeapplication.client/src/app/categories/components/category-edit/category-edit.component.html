<div class="category-edit p-4">
  <h1>{{title}}</h1>
  <p *ngIf="id && !category"><em>Loading...</em></p>
  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <!-- Name -->
    <mat-form-field>
      <mat-label>Name:</mat-label>
      <input matInput formControlName="name" required
             placeholder="Type a name">
      <mat-error *ngFor="let error of getErrors(form.get('name')!,'Name')">
        {{error}}
      </mat-error>
    </mat-form-field>
    <div class="flex justify-between">
      <div class="flex">
        <button mat-flat-button color="primary"
              type="submit" [disabled]="!form.valid">
          {{ this.id ? "Save" : "Create" }}
        </button>
        <button mat-flat-button mat-dialog-close color="secondary"
                [routerLink]="['/categories']">
          Cancel
        </button>
      </div>

      <div class="flex">
        <button class="mr-1"*ngIf="id"
                mat-flat-button
                color="warn"
                type="button"
                (click)="onArchive()">
          Archive
        </button>
        <button *ngIf="id"
                mat-flat-button
                color="warn"
                type="button"
                (click)="onDelete()">
          Delete
        </button>
      </div>
    </div>
  </form>
</div>
