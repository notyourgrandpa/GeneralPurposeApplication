<ng-container>
  <div class="w-full max-w-4xl p-4" *ngIf="inventoryLog else loading">
    <!-- Header -->
    <div class="flex items-start justify-between border-b pb-4">
      <div>
        <h2 class="text-2xl font-semibold text-gray-800">
          Inventory Log Details
        </h2>
      </div>

      <button mat-icon-button
              mat-dialog-close>

        <mat-icon>close</mat-icon>

      </button>
    </div>

    <!-- Body -->
    <div class="mt-6 space-y-8">
      <section>

        <div class="grid grid-cols-1 gap-5 md:grid-cols-2">

          <div>
            <label class="text-xs font-medium uppercase tracking-wide text-gray-500">
              Date
            </label>

            <div class="mt-1 rounded-lg border bg-gray-50 px-4 py-3">
              {{ inventoryLog?.date }}
            </div>
          </div>

          <div>
            <label class="text-xs font-medium uppercase tracking-wide text-gray-500">
              Product
            </label>

            <div class="mt-1 rounded-lg border bg-gray-50 px-4 py-3">
              {{ inventoryLog?.productName }}
            </div>
          </div>

          <div>
            <label class="text-xs font-medium uppercase tracking-wide text-gray-500">
              Change Type
            </label>

            <div class="mt-1 rounded-lg border bg-gray-50 px-4 py-3">
              {{ inventoryLog?.changeType | inventoryChangeType }}
            </div>
          </div>

          <div>
            <label class="text-xs font-medium uppercase tracking-wide text-gray-500">
              Remarks
            </label>

            <div class="mt-1 rounded-lg border bg-gray-50 px-4 py-3">
              {{ inventoryLog?.remarks }}
            </div>
          </div>

        </div>

      </section>

    </div>

    <!-- Footer -->
    <div class="mt-8 flex justify-end gap-3 border-t pt-5">

      <button mat-stroked-button
              mat-dialog-close>

        Close

      </button>

    </div>

  </div>
</ng-container>
<ng-template #loading>
  <div class="flex flex-col items-center justify-center gap-4 p-8">
    <mat-progress-spinner mode="indeterminate" diameter="32"></mat-progress-spinner>
    <p class="text-gray-600">Loading…</p>
  </div>
</ng-template>
